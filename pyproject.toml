[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setlist"
version = "0.1.0"
description = "Setlist - local YouTube -> Apple Music (ALAC) downloader with AI-assisted tagging"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "yt-dlp>=2024.1.0",
    "mutagen>=1.47",
    "pillow>=10.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
